<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TIC-TAC-TOE</title>
  <link rel="stylesheet" href="./output.css" />
  <link rel="stylesheet" href="./styles.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
  <script src="./main.js" defer></script>
</head>

<body class="relative min-h-screen overflow-hidden">
  <header class="flex flex-col items-center text-6xl text-white mt-14 font-bold">TIC-TAC-TOE</header>
  <div id="vanta-bg" class="absolute inset-0 -z-10"></div>
  <main class="flex items-center justify-center min-h-screen px-4 relative z-10 text-white mt-[-100px]">
    <div class="flex flex-col md:flex-row items-center justify-center gap-8">
      <div class="flex items-center justify-center w-full md:w-48 h-24 md:h-48">
        <div id="status"
          class="text-white text-xl font-mono px-4 py-2 rounded-lg text-center w-full md:w-auto border-2 border-cyan-400 bg-gradient-to-br from-white/20 to-cyan-400/30 backdrop-blur-md shadow-lg">
          Turno de X
        </div>
      </div>
      <div id="board" class="grid grid-cols-3 gap-2">
        <div class="cell w-24 h-24 md:w-40 md:h-40 bg-gray-700 flex items-center justify-center text-2xl cursor-pointer"
          data-i="0"></div>
        <div class="cell w-24 h-24 md:w-40 md:h-40 bg-gray-700 flex items-center justify-center text-2xl cursor-pointer"
          data-i="1"></div>
        <div class="cell w-24 h-24 md:w-40 md:h-40 bg-gray-700 flex items-center justify-center text-2xl cursor-pointer"
          data-i="2"></div>
        <div class="cell w-24 h-24 md:w-40 md:h-40 bg-gray-700 flex items-center justify-center text-2xl cursor-pointer"
          data-i="3"></div>
        <div class="cell w-24 h-24 md:w-40 md:h-40 bg-gray-700 flex items-center justify-center text-2xl cursor-pointer"
          data-i="4"></div>
        <div class="cell w-24 h-24 md:w-40 md:h-40 bg-gray-700 flex items-center justify-center text-2xl cursor-pointer"
          data-i="5"></div>
        <div class="cell w-24 h-24 md:w-40 md:h-40 bg-gray-700 flex items-center justify-center text-2xl cursor-pointer"
          data-i="6"></div>
        <div class="cell w-24 h-24 md:w-40 md:h-40 bg-gray-700 flex items-center justify-center text-2xl cursor-pointer"
          data-i="7"></div>
        <div class="cell w-24 h-24 md:w-40 md:h-40 bg-gray-700 flex items-center justify-center text-2xl cursor-pointer"
          data-i="8"></div>
      </div>
      <div class="flex items-center justify-center w-full md:w-48 h-24 md:h-48">
        <button id="reset"
          class="text-white text-xl font-mono px-4 py-2 rounded-lg w-full md:w-auto border-2 border-cyan-400 bg-gradient-to-br from-white/20 to-cyan-400/30 backdrop-blur-md shadow-lg hover:bg-cyan-400 hover:text-black transition">
          REINICIAR
        </button>
      </div>
    </div>
  </main>
</body>

</html>
