<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TIC-TAC-TOE</title>
  <link rel="stylesheet" href="./output.css" />
  <link rel="stylesheet" href="./styles.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
  <script src="./main.js" defer></script>
</head>

<body class="relative min-h-screen overflow-hidden">
  <div id="vanta-bg" class="absolute inset-0 -z-10"></div>
  <main class="flex flex-col items-center justify-center min-h-screen px-4 relative z-10 text-white">
    <h1 class="text-2xl font-bold mb-4">TIC-TAC-TOE</h1>
    <div id="board" class="grid grid-cols-3 gap-2 mb-4">
      <div class="cell w-40 h-40 bg-gray-700 flex items-center justify-center text-2xl cursor-pointer" data-i="0"></div>
      <div class="cell w-40 h-40 bg-gray-700 flex items-center justify-center text-2xl cursor-pointer" data-i="1"></div>
      <div class="cell w-40 h-40 bg-gray-700 flex items-center justify-center text-2xl cursor-pointer" data-i="2"></div>
      <div class="cell w-40 h-40 bg-gray-700 flex items-center justify-center text-2xl cursor-pointer" data-i="3"></div>
      <div class="cell w-40 h-40 bg-gray-700 flex items-center justify-center text-2xl cursor-pointer" data-i="4"></div>
      <div class="cell w-40 h-40 bg-gray-700 flex items-center justify-center text-2xl cursor-pointer" data-i="5"></div>
      <div class="cell w-40 h-40 bg-gray-700 flex items-center justify-center text-2xl cursor-pointer" data-i="6"></div>
      <div class="cell w-40 h-40 bg-gray-700 flex items-center justify-center text-2xl cursor-pointer" data-i="7"></div>
      <div class="cell w-40 h-40 bg-gray-700 flex items-center justify-center text-2xl cursor-pointer" data-i="8"></div>
    </div>
    <p id="status" class="mb-2">Turno de X</p>
    <button id="reset" class="bg-green-600 px-4 py-1 rounded">Reiniciar</button>
  </main>
</body>

</html>
