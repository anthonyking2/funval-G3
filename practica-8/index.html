<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./output.css">
    <script src="./main.js" defer></script>
    <title>TIC TAC TOE</title>
</head>
<body class="bg-gray-900 text-white flex flex-col items-center justify-center h-screen">

  <h1 class="text-3xl font-bold mb-6">Tic Tac Toe</h1>

  <div class="grid grid-cols-3 gap-4" id="board">
    <div class="cell w-24 h-24 bg-gray-800 flex items-center justify-center text-4xl font-bold" data-index="0"></div>
    <div class="cell w-24 h-24 bg-gray-800 flex items-center justify-center text-4xl font-bold" data-index="1"></div>
    <div class="cell w-24 h-24 bg-gray-800 flex items-center justify-center text-4xl font-bold" data-index="2"></div>
    <div class="cell w-24 h-24 bg-gray-800 flex items-center justify-center text-4xl font-bold" data-index="3"></div>
    <div class="cell w-24 h-24 bg-gray-800 flex items-center justify-center text-4xl font-bold" data-index="4"></div>
    <div class="cell w-24 h-24 bg-gray-800 flex items-center justify-center text-4xl font-bold" data-index="5"></div>
    <div class="cell w-24 h-24 bg-gray-800 flex items-center justify-center text-4xl font-bold" data-index="6"></div>
    <div class="cell w-24 h-24 bg-gray-800 flex items-center justify-center text-4xl font-bold" data-index="7"></div>
    <div class="cell w-24 h-24 bg-gray-800 flex items-center justify-center text-4xl font-bold" data-index="8"></div>
  </div>

  <p id="status" class="mt-6 text-xl font-semibold"></p>
  <button id="restart" class="mt-4 px-4 py-2 bg-green-500 rounded hover:bg-green-600 transition">
    Reiniciar juego
  </button>

</body>
</html>
